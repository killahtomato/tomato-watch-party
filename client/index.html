<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🍅&lt;/text&gt;&lt;/svg&gt;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato Watch Party</title>
    <script>
      try {
        var ls = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var fs = (localStorage.getItem('twp.followSystem') || 'false') === 'true';
        document.documentElement.dataset.theme = fs ? (ls ? 'light' : 'dark') : (localStorage.getItem('twp.theme') || 'dark');
        document.documentElement.dataset.accent = localStorage.getItem('twp.accent') || 'red';
        document.documentElement.dataset.chatSize = localStorage.getItem('twp.chatSize') || 'md';
        document.documentElement.dataset.subtitleSize = localStorage.getItem('twp.subtitleSize') || 'md';
        var rm = localStorage.getItem('twp.reduceMotion');
        var reduce = rm !== null ? rm === 'true' : (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        document.documentElement.dataset.motion = reduce ? 'reduced' : 'full';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
