services:
  movie-stream:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${MOVIE_DIR:-./movies}:/app/server/movies:ro
      - hls-data:/app/server/hls
    environment:
      - HOST_PASSWORD=${HOST_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret-key}
      - PORT=3000
      - MOVIE_DIR=/app/server/movies
      - HLS_DIR=/app/server/hls
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  hls-data:
