<!DOCTYPE html>
<html lang="en">

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0d0f" />

    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/m/apple-touch-icon.png" />
    <title>Tomato Watch Party</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('twp.theme') || 'dark';
        document.documentElement.dataset.accent = localStorage.getItem('twp.accent') || 'red';
      } catch (e) {}
    </script>

    <script type="module" src="/src/main.jsx"></script>
